name: Configuration Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source sur le runner
        uses: actions/checkout@v7

      - name: Afficher les fichiers récupérés sur le runner
        run: |
          echo 'Liste des fichiers:'
          ls -al

      - name: Configurer JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Afficher java version
        run: echo 'Java version:';java -version

      - name: Afficher maven version
        run: echo 'Maven version:';mvn -v