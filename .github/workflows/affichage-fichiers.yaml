name: Affichage fichiers

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du runner
      uses: actions/checkout@v7.0.1
    - name: Afficher les fichiers récupérés sur le runner
      run: |
       echo 'Liste des fichiers:'
       ls -al